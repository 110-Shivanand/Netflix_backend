# ═══════════════════════════════════════════════════════════════
#  docker-compose.yml — Production-ready backend with monitoring
#  Usage:
#    docker compose up -d --build
#  Secrets are read from .env (never committed to git).
# ═══════════════════════════════════════════════════════════════

services:

  # ── FastAPI backend ──────────────────────────────────────────
  api:
    # CI/CD sets DOCKERHUB_USERNAME and IMAGE_TAG in .env.
    # Local dev can still use `docker compose up --build` which
    # falls back to building from the Dockerfile when image is absent.
    image: ${DOCKERHUB_USERNAME:-local}/movies-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movies_api

    # ── Environment ─────────────────────────────────────────────
    # Docker Compose automatically reads .env in the same directory.
    # Each variable is explicitly mapped so the container only gets
    # what it needs — no accidental secret leakage.
    environment:
      APP_NAME:        ${APP_NAME}
      ENVIRONMENT:     ${ENVIRONMENT}
      OMDB_API_KEY:    ${OMDB_API_KEY}
      OMDB_BASE_URL:   ${OMDB_BASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      WORKERS:         ${WORKERS:-4}

    # ── Ports ───────────────────────────────────────────────────
    ports:
      - "${API_PORT:-8000}:8000"

    # ── Restart policy ──────────────────────────────────────────
    restart: unless-stopped

    # ── Health check (mirrors Dockerfile HEALTHCHECK) ───────────
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 15s

    # ── Resource limits ─────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus:   "${CPU_LIMIT:-1.0}"
          memory: "${MEM_LIMIT:-512m}"
        reservations:
          cpus:   "0.25"
          memory: "128m"

    # ── Logging ─────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ── Network ─────────────────────────────────────────────────
    networks:
      - backend_net


  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: movies_prometheus
    ports:
      - "9090:9090"
    volumes:
      # Config file (read-only)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Persistent data storage
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      # Allow Prometheus to run in a container without strict security
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - backend_net
    depends_on:
      api:
        condition: service_healthy


  # ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.2
    container_name: movies_grafana
    ports:
      - "3000:3000"
    volumes:
      # Persistent data storage
      - grafana_data:/var/lib/grafana
      # Auto-provision datasources
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Auto-provision dashboards
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      # Admin credentials (change these in production!)
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=UTC
      # Enable dashboard provisioning
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - backend_net
    depends_on:
      - prometheus


