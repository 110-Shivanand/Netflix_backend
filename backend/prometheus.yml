# ═══════════════════════════════════════════════════════════════
#  Prometheus Configuration — Movies API Monitoring
#
#  This config scrapes metrics from the backend FastAPI application
#  and exposes them for Grafana visualization.
# ═══════════════════════════════════════════════════════════════

global:
  # How often Prometheus scrapes targets by default (in seconds)
  scrape_interval: 15s

  # How long until a scrape request times out
  scrape_timeout: 10s

  # How often Prometheus evaluates alert rules
  evaluation_interval: 15s

# ── Scrape targets ──────────────────────────────────────────
scrape_configs:

  # Prometheus itself metrics (optional, for monitoring Prometheus)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── FastAPI Backend ─────────────────────────────────────────
  # Scrapes metrics from /metrics endpoint of the backend API.
  # Uses Docker Compose service name 'api' for internal DNS.
  - job_name: 'movies-api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'

    # DNS resolution method: resolve Docker service names using
    # the internal Docker network DNS.
    static_configs:
      # Service name 'api' is available within the Docker Compose network
      - targets: ['api:8000']
        labels:
          service: 'movies-api'
          environment: 'production'

    # Relabel configs (optional, for filtering or renaming metrics)
    # Example: drop metrics we don't care about
    # metric_relabel_configs:
    #   - source_labels: [__name__]
    #     regex: 'go_.*'
    #     action: drop

# ── Alertmanager (optional, commented out) ──────────────────
# Uncomment below to enable alert routing to Alertmanager
#
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

