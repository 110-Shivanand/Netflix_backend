# ═══════════════════════════════════════════════════════════════
#  Grafana Dashboard Provisioning Config
#
#  This tells Grafana where to find dashboard JSON files to load
#  on startup. Dashboards in these paths will be auto-imported.
# ═══════════════════════════════════════════════════════════════

apiVersion: 1

providers:
  - name: 'Movies API Dashboards'
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/definitions
