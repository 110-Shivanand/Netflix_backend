# ═══════════════════════════════════════════════════════════════
#  CI/CD Pipeline — Movies API Backend
#
#  Flow:
#    1. Triggered on push to `main` (or manual dispatch)
#    2. Run lint + import check
#    3. Build Docker image & push to Docker Hub
#    4. SSH into EC2 → write .env from GitHub Secrets
#    5. Pull new image & restart container via docker compose
#
#  Required GitHub Secrets  (Settings → Secrets → Actions):
#  ┌─────────────────────────┬──────────────────────────────────────┐
#  │ Secret name             │ Value                                │
#  ├─────────────────────────┼──────────────────────────────────────┤
#  │ DOCKERHUB_USERNAME      │ your Docker Hub username             │
#  │ DOCKERHUB_TOKEN         │ Docker Hub access token (not passwd) │
#  │ EC2_HOST                │ public IP or DNS of your EC2         │
#  │ EC2_USER                │ ec2-user  /  ubuntu  (distro user)  │
#  │ EC2_SSH_KEY             │ full PEM private key (-----BEGIN…)  │
#  │ APP_NAME                │ Movies API                           │
#  │ ENVIRONMENT             │ production                           │
#  │ OMDB_API_KEY            │ 9daaf95   (your real key)           │
#  │ OMDB_BASE_URL           │ http://www.omdbapi.com/              │
#  │ ALLOWED_ORIGINS         │ https://yourdomain.com               │
#  │ API_PORT                │ 8000                                 │
#  │ WORKERS                 │ 4                                    │
#  │ CPU_LIMIT               │ 1.0                                  │
#  │ MEM_LIMIT               │ 512m                                 │
#  └─────────────────────────┴──────────────────────────────────────┘
# ═══════════════════════════════════════════════════════════════

name: Build → Push → Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual trigger from GitHub UI

# Cancel any in-progress run on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/movies-api
  DEPLOY_DIR: ~/movies-api          # directory on EC2

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Lint & sanity-check
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training_folders/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training_folders/backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Verify app imports without error
        run: python -c "from app.main import app; print('✅ app loaded OK')"

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Build & push Docker image to Docker Hub
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: training_folders/backend

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Multi-platform builds use QEMU + buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate tags:  latest  +  git-sha (first 7 chars)  +  branch name
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: training_folders/backend
          file:    training_folders/backend/Dockerfile
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          # cache layers in the GitHub Actions cache
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          # build for amd64 (EC2) + arm64 (optional)
          platforms: linux/amd64

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to EC2
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production      # maps to a GitHub Environment (optional)

    steps:
      - name: Checkout code  (to copy docker-compose.yml to EC2)
        uses: actions/checkout@v4

      # ── Write SSH key to disk ──────────────────────────────
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # avoid host-key prompt
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Copy docker-compose.yml to EC2 ────────────────────
      - name: Copy docker-compose.yml to EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "mkdir -p ${{ env.DEPLOY_DIR }}"

          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              training_folders/backend/docker-compose.yml \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml

      # ── Write .env on EC2 from GitHub Secrets ─────────────
      # This runs entirely over SSH — the .env file is written
      # directly on the server, never stored in the runner or logs.
      - name: Write .env on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "cat > ${{ env.DEPLOY_DIR }}/.env <<'EOF'
          # Auto-generated by GitHub Actions — do not edit manually
          # Last deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          APP_NAME=${{ secrets.APP_NAME }}
          ENVIRONMENT=${{ secrets.ENVIRONMENT }}

          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          OMDB_BASE_URL=${{ secrets.OMDB_BASE_URL }}

          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}

          API_PORT=${{ secrets.API_PORT }}
          WORKERS=${{ secrets.WORKERS }}
          CPU_LIMIT=${{ secrets.CPU_LIMIT }}
          MEM_LIMIT=${{ secrets.MEM_LIMIT }}

          # Image to run (pinned to the SHA just pushed)
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          EOF"

      # ── Pull new image & restart via docker compose ────────
      - name: Pull & restart container
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "
            set -e
            cd ${{ env.DEPLOY_DIR }}

            echo '── Pulling latest image ──'
            docker compose pull api

            echo '── Restarting container (zero-downtime recreate) ──'
            docker compose up -d --remove-orphans --wait

            echo '── Pruning unused images ──'
            docker image prune -f

            echo '── Container status ──'
            docker compose ps

            echo '── Health check ──'
            sleep 5
            curl -sf http://localhost:${{ secrets.API_PORT }}/health \
              && echo '✅ Health check passed' \
              || (echo '❌ Health check FAILED' && exit 1)
          "

      # ── Cleanup SSH key from runner ────────────────────────
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # ── Notify on failure ──────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to EC2 failed. Check logs above."
          echo "Image pushed: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
          echo "Target: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
